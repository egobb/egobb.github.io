{{ define "main" }}
  <div class="portfolio-longform-shell">
    {{ partial "navigation/breadcrumb.html" . }}

    <header class="portfolio-longform-header">
      <h1>{{ .Title }}</h1>
      {{ with .Params.summary }}
        <p class="portfolio-longform-summary">{{ . | plainify }}</p>
      {{ end }}
    </header>

    <article data-visual-role="longform-content" class="portfolio-longform-content prose prose-neutral dark:prose-invert">
      {{ .Content }}
    </article>

    {{ if site.Params.comments.enabled }}
      {{ partial "features/comments.html" . }}
    {{ end }}
  </div>
{{ end }}
