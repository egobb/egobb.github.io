{{ define "main" }}
  <div class="mx-auto max-w-4xl">
    {{ partial "navigation/breadcrumb.html" . }}

    <header class="mb-8">
      <h1 class="text-foreground mb-4 text-3xl font-bold">{{ .Title }}</h1>
      {{ if .Content }}
        <div class="prose prose-neutral dark:prose-invert max-w-none">
          {{ .Content }}
        </div>
      {{ end }}
    </header>

    {{ partial "portfolio/selected-projects.html" (dict "hideHeader" true) }}
  </div>
{{ end }}
