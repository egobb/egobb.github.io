<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Order Tracking event-driven architecture</title><desc id="desc">A request enters through REST, the application publishes tracking events keyed by order ID to Kafka, a consumer group processes them through domain rules, then persists an order projection and append-only audit history. Kafka partitioning keeps events for the same order on the same partition.</desc><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1724"/><stop offset="1" stop-color="#0a1019"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#72829b"/></marker><marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#213047" opacity="0.38"/></pattern></defs><rect width="1200" height="650" rx="28" fill="#070b11"/><rect x="1" y="1" width="1198" height="648" rx="27" fill="url(#panel)" stroke="#273448" stroke-width="2"/><rect x="1" y="1" width="1198" height="648" rx="27" fill="url(#dots)" opacity="0.65"/><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="54" y="62" fill="#8ea1b8" font-size="15" font-weight="700" letter-spacing="2.2">ORDER TRACKING · EVENT-DRIVEN FLOW</text><text x="54" y="96" fill="#f8fafc" font-size="27" font-weight="750">Per-order ordering without coupling domain rules to Kafka</text><g transform="translate(932,48)"><rect width="214" height="52" rx="16" fill="#101c29" stroke="#2c5368"/><circle cx="26" cy="26" r="7" fill="#38bdf8"/><text x="44" y="22" fill="#8ea1b8" font-size="11" font-weight="700" letter-spacing="1.2">ORDERING SCOPE</text><text x="44" y="39" fill="#e0f2fe" font-size="15" font-weight="700">one orderId</text></g><path d="M230 285 H278" fill="none" stroke="#72829b" stroke-width="3" marker-end="url(#arrow)"/><path d="M470 285 H506" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowCyan)"/><path d="M794 285 H830" fill="none" stroke="#72829b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1018 285 H1050" fill="none" stroke="#72829b" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="54" y="180" width="176" height="210" rx="22" fill="#0c1520" stroke="#26384c" stroke-width="2"/><rect x="54" y="180" width="176" height="6" rx="3" fill="#38bdf8"/><circle cx="94" cy="226" r="19" fill="#102a3a" stroke="#1f647d"/><path d="M86 226 h16 M96 216 l10 10 -10 10" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="270" fill="#f8fafc" font-size="19" font-weight="750">REST adapter</text><text x="78" y="296" fill="#8ea1b8" font-size="14">POST /order/tracking</text><line x1="78" y1="319" x2="206" y2="319" stroke="#243246"/><text x="78" y="345" fill="#cbd5e1" font-size="14">Accept batch</text><text x="78" y="368" fill="#cbd5e1" font-size="14">Validate input</text></g><g filter="url(#shadow)"><rect x="278" y="180" width="192" height="210" rx="22" fill="#0c1520" stroke="#26384c" stroke-width="2"/><rect x="278" y="180" width="192" height="6" rx="3" fill="#38bdf8"/><circle cx="318" cy="226" r="19" fill="#102a3a" stroke="#1f647d"/><path d="M308 226 h20 M318 216 v20" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/><text x="302" y="270" fill="#f8fafc" font-size="19" font-weight="750">Application</text><text x="302" y="296" fill="#8ea1b8" font-size="14">publish domain event</text><line x1="302" y1="319" x2="446" y2="319" stroke="#243246"/><text x="302" y="345" fill="#cbd5e1" font-size="14">Emit TrackingEvent</text><text x="302" y="368" fill="#7dd3fc" font-size="14" font-weight="700">key = orderId</text></g><g filter="url(#shadow)"><rect x="506" y="145" width="288" height="280" rx="24" fill="#0d1422" stroke="#3b3560" stroke-width="2"/><rect x="506" y="145" width="288" height="6" rx="3" fill="#a78bfa"/><g transform="translate(532,172)"><circle cx="20" cy="20" r="18" fill="#221c3a" stroke="#5d4ca2"/><circle cx="20" cy="20" r="4" fill="#c4b5fd"/><circle cx="10" cy="13" r="3" fill="#8b7bd8"/><circle cx="31" cy="13" r="3" fill="#8b7bd8"/><circle cx="10" cy="28" r="3" fill="#8b7bd8"/><circle cx="31" cy="28" r="3" fill="#8b7bd8"/></g><text x="581" y="193" fill="#f8fafc" font-size="21" font-weight="750">Kafka topic</text><text x="581" y="216" fill="#b6a8e8" font-size="13" font-weight="650">KEYED PARTITIONING</text><g transform="translate(532,238)"><rect width="236" height="45" rx="12" fill="#151d2d" stroke="#343f56"/><text x="16" y="28" fill="#8ea1b8" font-size="13" font-weight="700">P0</text><g transform="translate(56,9)"><rect width="42" height="27" rx="8" fill="#152d3c" stroke="#2a7896"/><text x="21" y="18" text-anchor="middle" fill="#bae6fd" font-size="11" font-weight="700">A·1</text><rect x="50" width="42" height="27" rx="8" fill="#152d3c" stroke="#2a7896"/><text x="71" y="18" text-anchor="middle" fill="#bae6fd" font-size="11" font-weight="700">A·2</text><rect x="100" width="42" height="27" rx="8" fill="#152d3c" stroke="#2a7896"/><text x="121" y="18" text-anchor="middle" fill="#bae6fd" font-size="11" font-weight="700">A·3</text><path d="M42 13 H50 M92 13 H100" stroke="#38bdf8" stroke-width="2"/></g></g><g transform="translate(532,293)"><rect width="236" height="45" rx="12" fill="#121a28" stroke="#2c3548"/><text x="16" y="28" fill="#8ea1b8" font-size="13" font-weight="700">P1</text><rect x="56" y="9" width="42" height="27" rx="8" fill="#211d36" stroke="#5d4ca2"/><text x="77" y="27" text-anchor="middle" fill="#ddd6fe" font-size="11" font-weight="700">B·1</text><rect x="106" y="9" width="42" height="27" rx="8" fill="#211d36" stroke="#5d4ca2"/><text x="127" y="27" text-anchor="middle" fill="#ddd6fe" font-size="11" font-weight="700">B·2</text></g><g transform="translate(532,348)"><rect width="236" height="45" rx="12" fill="#121a28" stroke="#2c3548"/><text x="16" y="28" fill="#8ea1b8" font-size="13" font-weight="700">Pn</text><text x="56" y="28" fill="#65758b" font-size="13">other order keys</text></g><text x="532" y="411" fill="#7dd3fc" font-size="12" font-weight="700">same key → same partition → ordered</text></g><g filter="url(#shadow)"><rect x="830" y="180" width="188" height="210" rx="22" fill="#0c1520" stroke="#26384c" stroke-width="2"/><rect x="830" y="180" width="188" height="6" rx="3" fill="#34d399"/><circle cx="870" cy="226" r="19" fill="#10261f" stroke="#2f765d"/><path d="M861 226 l7 7 12-15" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="854" y="270" fill="#f8fafc" font-size="19" font-weight="750">Consumer group</text><text x="854" y="296" fill="#8ea1b8" font-size="14">TrackingEventListener</text><line x1="854" y1="319" x2="994" y2="319" stroke="#243246"/><text x="854" y="345" fill="#cbd5e1" font-size="14">Map event</text><text x="854" y="368" fill="#cbd5e1" font-size="14">Delegate processing</text></g><g filter="url(#shadow)"><rect x="1050" y="145" width="96" height="280" rx="22" fill="#0d1917" stroke="#2d5147" stroke-width="2"/><rect x="1050" y="145" width="96" height="6" rx="3" fill="#34d399"/><text x="1098" y="187" text-anchor="middle" fill="#d1fae5" font-size="13" font-weight="750">DOMAIN</text><rect x="1065" y="209" width="66" height="64" rx="13" fill="#10261f" stroke="#356957"/><text x="1098" y="235" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Processor</text><text x="1098" y="254" text-anchor="middle" fill="#94a3b8" font-size="10">workflow</text><path d="M1098 282 V302" stroke="#557062" stroke-width="2" marker-end="url(#arrow)"/><rect x="1065" y="308" width="66" height="64" rx="13" fill="#10261f" stroke="#356957"/><text x="1098" y="334" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">State</text><text x="1098" y="351" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Machine</text><text x="1098" y="368" text-anchor="middle" fill="#94a3b8" font-size="9.5">rules</text></g><g><path d="M1098 425 V470 H930" fill="none" stroke="#557062" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1098 425 V540 H930" fill="none" stroke="#557062" stroke-width="2.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="726" y="445" width="204" height="72" rx="18" fill="#101821" stroke="#3a4658"/><ellipse cx="760" cy="474" rx="13" ry="6" fill="#182534" stroke="#7690aa"/><path d="M747 474 v18 c0 3 6 6 13 6 s13-3 13-6 v-18" fill="#182534" stroke="#7690aa"/><text x="789" y="475" fill="#f8fafc" font-size="15" font-weight="700">Order projection</text><text x="789" y="496" fill="#8ea1b8" font-size="12">current state for reads</text></g><g filter="url(#shadow)"><rect x="726" y="527" width="204" height="72" rx="18" fill="#101821" stroke="#3a4658"/><path d="M747 549 h24 v28 h-24 z M751 555 h16 M751 561 h16 M751 567 h11" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/><text x="789" y="557" fill="#f8fafc" font-size="15" font-weight="700">Append-only audit</text><text x="789" y="578" fill="#8ea1b8" font-size="12">accepted event history</text></g></g><g transform="translate(54,462)"><rect width="612" height="137" rx="20" fill="#0b131e" stroke="#26384c"/><text x="24" y="34" fill="#8ea1b8" font-size="12" font-weight="700" letter-spacing="1.3">DELIVERY BOUNDARY</text><g transform="translate(24,51)"><circle cx="7" cy="9" r="5" fill="#38bdf8"/><text x="23" y="14" fill="#dbeafe" font-size="14"><tspan font-weight="700">Producer:</tspan> acks=all · retries · idempotence</text></g><g transform="translate(24,81)"><circle cx="7" cy="9" r="5" fill="#64748b"/><text x="23" y="14" fill="#cbd5e1" font-size="14">Ordering is per order, not global</text></g><g transform="translate(24,111)"><circle cx="7" cy="9" r="5" fill="#f59e0b"/><text x="23" y="14" fill="#fde68a" font-size="14">End-to-end deduplication is a known next step</text></g></g></g></svg>