<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1120" role="img" aria-labelledby="title desc"><title id="title">Order Tracking event-driven architecture</title><desc id="desc">A vertical mobile diagram showing REST ingestion, application publishing with order ID as Kafka key, keyed Kafka partitions, consumer and domain processing, then projection and audit persistence.</desc><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1724"/><stop offset="1" stop-color="#0a1019"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#72829b"/></marker><marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#213047" opacity="0.38"/></pattern></defs><rect width="700" height="1120" rx="28" fill="#070b11"/><rect x="1" y="1" width="698" height="1118" rx="27" fill="url(#panel)" stroke="#273448" stroke-width="2"/><rect x="1" y="1" width="698" height="1118" rx="27" fill="url(#dots)" opacity="0.65"/><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="42" y="58" fill="#8ea1b8" font-size="18" font-weight="700" letter-spacing="2">ORDER TRACKING · EVENT FLOW</text><text x="42" y="96" fill="#f8fafc" font-size="28" font-weight="750">Per-order ordering with Kafka</text><text x="42" y="126" fill="#9fb0c4" font-size="17">Domain rules stay independent from transport.</text><g filter="url(#shadow)"><rect x="42" y="164" width="280" height="156" rx="22" fill="#0c1520" stroke="#26384c" stroke-width="2"/><rect x="42" y="164" width="280" height="6" rx="3" fill="#38bdf8"/><text x="68" y="207" fill="#7dd3fc" font-size="14" font-weight="700" letter-spacing="1">INGEST</text><text x="68" y="241" fill="#f8fafc" font-size="23" font-weight="750">REST adapter</text><text x="68" y="269" fill="#8ea1b8" font-size="17">POST /order/tracking</text><text x="68" y="297" fill="#cbd5e1" font-size="16">Accept batch · validate input</text></g><path d="M322 242 H368" fill="none" stroke="#72829b" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="378" y="164" width="280" height="156" rx="22" fill="#0c1520" stroke="#26384c" stroke-width="2"/><rect x="378" y="164" width="280" height="6" rx="3" fill="#38bdf8"/><text x="404" y="207" fill="#7dd3fc" font-size="14" font-weight="700" letter-spacing="1">APPLICATION</text><text x="404" y="241" fill="#f8fafc" font-size="23" font-weight="750">Publish event</text><text x="404" y="269" fill="#8ea1b8" font-size="17">TrackingEvent</text><text x="404" y="297" fill="#bae6fd" font-size="16" font-weight="700">key = orderId</text></g><path d="M518 320 V362" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowCyan)"/><g filter="url(#shadow)"><rect x="42" y="374" width="616" height="286" rx="24" fill="#0d1422" stroke="#3b3560" stroke-width="2"/><rect x="42" y="374" width="616" height="6" rx="3" fill="#a78bfa"/><text x="70" y="420" fill="#c4b5fd" font-size="14" font-weight="700" letter-spacing="1">KAFKA · KEYED PARTITIONING</text><text x="70" y="456" fill="#f8fafc" font-size="24" font-weight="750">Same orderId → same partition → ordered</text><g transform="translate(70,486)"><rect width="560" height="48" rx="13" fill="#151d2d" stroke="#343f56"/><text x="18" y="31" fill="#8ea1b8" font-size="16" font-weight="700">P0</text><g transform="translate(74,9)"><rect width="70" height="30" rx="9" fill="#152d3c" stroke="#2a7896"/><text x="35" y="20" text-anchor="middle" fill="#bae6fd" font-size="13" font-weight="700">A · 1</text><path d="M70 15 H86" stroke="#38bdf8" stroke-width="2"/><rect x="86" width="70" height="30" rx="9" fill="#152d3c" stroke="#2a7896"/><text x="121" y="20" text-anchor="middle" fill="#bae6fd" font-size="13" font-weight="700">A · 2</text><path d="M156 15 H172" stroke="#38bdf8" stroke-width="2"/><rect x="172" width="70" height="30" rx="9" fill="#152d3c" stroke="#2a7896"/><text x="207" y="20" text-anchor="middle" fill="#bae6fd" font-size="13" font-weight="700">A · 3</text><text x="264" y="20" fill="#7dd3fc" font-size="13" font-weight="700">ORDER A</text></g></g><g transform="translate(70,545)"><rect width="560" height="48" rx="13" fill="#121a28" stroke="#2c3548"/><text x="18" y="31" fill="#8ea1b8" font-size="16" font-weight="700">P1</text><rect x="74" y="9" width="70" height="30" rx="9" fill="#211d36" stroke="#5d4ca2"/><text x="109" y="29" text-anchor="middle" fill="#ddd6fe" font-size="13" font-weight="700">B · 1</text><rect x="160" y="9" width="70" height="30" rx="9" fill="#211d36" stroke="#5d4ca2"/><text x="195" y="29" text-anchor="middle" fill="#ddd6fe" font-size="13" font-weight="700">B · 2</text><text x="338" y="29" fill="#a78bfa" font-size="13" font-weight="700">ORDER B</text></g><g transform="translate(70,604)"><rect width="560" height="34" rx="12" fill="#121a28" stroke="#2c3548"/><text x="18" y="23" fill="#8ea1b8" font-size="15" font-weight="700">Pn</text><text x="74" y="23" fill="#65758b" font-size="14">other order keys can progress in parallel</text></g></g><path d="M350 660 V702" fill="none" stroke="#72829b" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="42" y="714" width="616" height="168" rx="24" fill="#0c171a" stroke="#2d5147" stroke-width="2"/><rect x="42" y="714" width="616" height="6" rx="3" fill="#34d399"/><text x="70" y="758" fill="#6ee7b7" font-size="14" font-weight="700" letter-spacing="1">CONSUME + DOMAIN</text><g transform="translate(70,782)"><rect width="160" height="70" rx="16" fill="#10261f" stroke="#356957"/><text x="80" y="30" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Listener</text><text x="80" y="52" text-anchor="middle" fill="#94a3b8" font-size="13">map event</text></g><path d="M238 817 H273" fill="none" stroke="#557062" stroke-width="2.5" marker-end="url(#arrow)"/><g transform="translate(282,782)"><rect width="160" height="70" rx="16" fill="#10261f" stroke="#356957"/><text x="80" y="30" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Processor</text><text x="80" y="52" text-anchor="middle" fill="#94a3b8" font-size="13">workflow</text></g><path d="M450 817 H485" fill="none" stroke="#557062" stroke-width="2.5" marker-end="url(#arrow)"/><g transform="translate(494,782)"><rect width="136" height="70" rx="16" fill="#10261f" stroke="#356957"/><text x="68" y="30" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">State Machine</text><text x="68" y="52" text-anchor="middle" fill="#94a3b8" font-size="13">domain rules</text></g></g><path d="M350 882 V924" fill="none" stroke="#72829b" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="42" y="936" width="292" height="104" rx="20" fill="#101821" stroke="#3a4658"/><ellipse cx="80" cy="971" rx="14" ry="7" fill="#182534" stroke="#7690aa"/><path d="M66 971 v23 c0 4 6 7 14 7 s14-3 14-7 v-23" fill="#182534" stroke="#7690aa"/><text x="111" y="973" fill="#f8fafc" font-size="19" font-weight="700">Order projection</text><text x="111" y="1001" fill="#8ea1b8" font-size="15">current state for reads</text></g><g filter="url(#shadow)"><rect x="366" y="936" width="292" height="104" rx="20" fill="#101821" stroke="#3a4658"/><path d="M392 958 h28 v34 h-28 z M398 965 h16 M398 972 h16 M398 979 h12" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/><text x="437" y="973" fill="#f8fafc" font-size="19" font-weight="700">Append-only audit</text><text x="437" y="1001" fill="#8ea1b8" font-size="15">accepted event history</text></g><g transform="translate(42,1062)"><circle cx="8" cy="8" r="6" fill="#38bdf8"/><text x="26" y="13" fill="#dbeafe" font-size="15"><tspan font-weight="700">Producer:</tspan> acks=all · retries · idempotence</text><circle cx="365" cy="8" r="6" fill="#f59e0b"/><text x="383" y="13" fill="#fde68a" font-size="15">E2E dedupe: next step</text></g></g></svg>