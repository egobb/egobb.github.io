<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 1120" role="img" aria-labelledby="title desc"><title id="title">Snapshot Ingestion mobile architecture</title><desc id="desc">A vertical view of the Snapshot Ingestion architecture: provider XML is streamed by a fetch worker under an advisory lock into PostgreSQL staging, processing workers claim rows with SKIP LOCKED and upsert canonical plans, then the search API reads PostgreSQL only.</desc><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1724"/><stop offset="1" stop-color="#090f17"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000" flood-opacity="0.26"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#73839a"/></marker><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#213047" opacity="0.38"/></pattern></defs><rect width="620" height="1120" rx="28" fill="#070b11"/><rect x="1" y="1" width="618" height="1118" rx="27" fill="url(#panel)" stroke="#273448" stroke-width="2"/><rect x="1" y="1" width="618" height="1118" rx="27" fill="url(#dots)" opacity="0.65"/><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="34" y="49" fill="#8ea1b8" font-size="13" font-weight="700" letter-spacing="1.6">SNAPSHOT INGESTION</text><text x="34" y="81" fill="#f8fafc" font-size="23" font-weight="750">PostgreSQL as durable coordination</text><text x="34" y="108" fill="#94a3b8" font-size="13">Provider failures stay outside the read path.</text><g transform="translate(34,136)" filter="url(#shadow)"><rect width="552" height="112" rx="20" fill="#0c1520" stroke="#26384c" stroke-width="2"/><rect width="552" height="6" rx="3" fill="#38bdf8"/><circle cx="38" cy="53" r="17" fill="#102a3a" stroke="#1f647d"/><path d="M30 47 h16 M30 53 h16 M30 59 h11" fill="none" stroke="#7dd3fc" stroke-width="2.1" stroke-linecap="round"/><text x="70" y="49" fill="#f8fafc" font-size="18" font-weight="750">Provider XML snapshot</text><text x="70" y="73" fill="#8ea1b8" font-size="12">network + payload are the unreliable boundary</text><text x="414" y="58" fill="#7dd3fc" font-size="11" font-weight="700">HTTP stream</text></g><path d="M310 248 V282" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/><g transform="translate(34,282)" filter="url(#shadow)"><rect width="552" height="150" rx="20" fill="#0c1520" stroke="#26384c" stroke-width="2"/><rect width="552" height="6" rx="3" fill="#38bdf8"/><circle cx="38" cy="50" r="17" fill="#102a3a" stroke="#1f647d"/><path d="M29 50 h18 M38 41 v18" fill="none" stroke="#7dd3fc" stroke-width="2.1" stroke-linecap="round"/><text x="70" y="46" fill="#f8fafc" font-size="18" font-weight="750">Fetch worker</text><text x="70" y="70" fill="#8ea1b8" font-size="12">stream parse → batch stage</text><g transform="translate(70,91)"><rect width="160" height="34" rx="10" fill="#142638" stroke="#2b6c8b"/><circle cx="18" cy="17" r="5" fill="#38bdf8"/><text x="31" y="22" fill="#bae6fd" font-size="11" font-weight="700">advisory lock</text></g><text x="247" y="113" fill="#cbd5e1" font-size="11">one active fetch / provider</text></g><path d="M310 432 V466" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/><g transform="translate(34,466)" filter="url(#shadow)"><rect width="552" height="300" rx="22" fill="#0d1422" stroke="#3b4660" stroke-width="2"/><rect width="552" height="6" rx="3" fill="#a78bfa"/><text x="28" y="42" fill="#f8fafc" font-size="19" font-weight="750">PostgreSQL</text><text x="148" y="42" fill="#b8aee8" font-size="11" font-weight="700" letter-spacing="1">DURABLE STATE + COORDINATION</text><g transform="translate(28,62)"><rect width="496" height="60" rx="14" fill="#121b29" stroke="#343f56"/><text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="700">ingestion_runs</text><text x="16" y="44" fill="#8ea1b8" font-size="11">partial fetches stay unclaimable until the run is STAGED</text></g><g transform="translate(28,134)"><rect width="496" height="80" rx="14" fill="#10251f" stroke="#356957"/><text x="16" y="23" fill="#d1fae5" font-size="13" font-weight="750">staging_plans</text><text x="16" y="43" fill="#9fb4aa" font-size="11">PENDING → PROCESSING → DONE / FAILED</text><rect x="16" y="53" width="118" height="20" rx="7" fill="#123126" stroke="#3b8067"/><text x="75" y="67" text-anchor="middle" fill="#a7f3d0" font-size="9.5" font-weight="700">FOR UPDATE</text><rect x="142" y="53" width="116" height="20" rx="7" fill="#123126" stroke="#3b8067"/><text x="200" y="67" text-anchor="middle" fill="#a7f3d0" font-size="9.5" font-weight="700">SKIP LOCKED</text></g><g transform="translate(28,226)"><rect width="496" height="50" rx="14" fill="#151d2a" stroke="#3d4a60"/><text x="16" y="22" fill="#f8fafc" font-size="13" font-weight="700">plans</text><text x="16" y="40" fill="#8ea1b8" font-size="10.5">canonical upsert · stable read model · composite identity</text></g></g><path d="M586 615 H606 V806 H548" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/><g transform="translate(34,794)" filter="url(#shadow)"><rect width="250" height="130" rx="20" fill="#0c1715" stroke="#2d5147" stroke-width="2"/><rect width="250" height="6" rx="3" fill="#34d399"/><text x="24" y="42" fill="#f8fafc" font-size="17" font-weight="750">Process workers</text><text x="24" y="64" fill="#8ea1b8" font-size="11">claim different rows concurrently</text><g transform="translate(24,79)"><rect width="58" height="28" rx="9" fill="#10261f" stroke="#356957"/><text x="29" y="18" text-anchor="middle" fill="#d1fae5" font-size="10" font-weight="700">A</text><rect x="66" width="58" height="28" rx="9" fill="#10261f" stroke="#356957"/><text x="95" y="18" text-anchor="middle" fill="#d1fae5" font-size="10" font-weight="700">B</text><rect x="132" width="58" height="28" rx="9" fill="#10261f" stroke="#356957"/><text x="161" y="18" text-anchor="middle" fill="#d1fae5" font-size="10" font-weight="700">N</text></g></g><path d="M284 858 H322" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/><g transform="translate(322,794)" filter="url(#shadow)"><rect width="264" height="130" rx="20" fill="#0c1520" stroke="#26384c" stroke-width="2"/><rect width="264" height="6" rx="3" fill="#fbbf24"/><text x="24" y="42" fill="#f8fafc" font-size="17" font-weight="750">Search API</text><text x="24" y="64" fill="#8ea1b8" font-size="11">reads canonical plans only</text><g transform="translate(24,79)"><rect width="94" height="28" rx="9" fill="#2b2413" stroke="#7a6428"/><text x="47" y="18" text-anchor="middle" fill="#fde68a" font-size="10" font-weight="700">bulkhead</text><rect x="102" width="78" height="28" rx="9" fill="#1b2230" stroke="#48566b"/><text x="141" y="18" text-anchor="middle" fill="#cbd5e1" font-size="10" font-weight="700">cache</text></g></g><path d="M454 924 V950" fill="none" stroke="#73839a" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(34,950)"><rect width="552" height="128" rx="20" fill="#0b131e" stroke="#26384c"/><text x="24" y="30" fill="#8ea1b8" font-size="10.5" font-weight="700" letter-spacing="1.1">RECOVERY CONTRACT</text><circle cx="28" cy="55" r="5" fill="#38bdf8"/><text x="42" y="60" fill="#dbeafe" font-size="11">Fetch: bounded retry + completed-run gate</text><circle cx="28" cy="80" r="5" fill="#34d399"/><text x="42" y="85" fill="#d1fae5" font-size="11">Process: retry metadata + stale PROCESSING requeue</text><circle cx="28" cy="105" r="5" fill="#fbbf24"/><text x="42" y="110" fill="#fde68a" font-size="11">Read: provider isolated; DB saturation fails fast</text></g></g></svg>