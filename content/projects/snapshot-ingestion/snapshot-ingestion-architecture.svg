<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Snapshot Ingestion PostgreSQL-coordinated architecture</title><desc id="desc">Provider XML is streamed by a fetch worker protected by a per-provider advisory lock into PostgreSQL ingestion runs and staging rows. Processing workers claim completed staging rows with SKIP LOCKED and upsert canonical plans. The search API reads PostgreSQL only, with a bounded cache and bulkhead.</desc><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1724"/><stop offset="1" stop-color="#090f17"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#73839a"/></marker><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#213047" opacity="0.38"/></pattern></defs><rect width="1200" height="700" rx="28" fill="#070b11"/><rect x="1" y="1" width="1198" height="698" rx="27" fill="url(#panel)" stroke="#273448" stroke-width="2"/><rect x="1" y="1" width="1198" height="698" rx="27" fill="url(#dots)" opacity="0.65"/><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="52" y="58" fill="#8ea1b8" font-size="15" font-weight="700" letter-spacing="2.1">SNAPSHOT INGESTION · COORDINATION FLOW</text><text x="52" y="94" fill="#f8fafc" font-size="28" font-weight="750">Durable ingestion without adding a broker before the workload needs one</text><g transform="translate(924,48)"><rect width="224" height="56" rx="17" fill="#101c29" stroke="#2c5368"/><circle cx="27" cy="28" r="7" fill="#38bdf8"/><text x="46" y="23" fill="#8ea1b8" font-size="11" font-weight="700" letter-spacing="1.1">READ PATH</text><text x="46" y="42" fill="#e0f2fe" font-size="15" font-weight="700">Postgres only</text></g><path d="M212 260 H258" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/><path d="M466 260 H506" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/><path d="M812 286 H854" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/><path d="M930 391 V428 H804" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/><path d="M812 492 H856" fill="none" stroke="#73839a" stroke-width="3" marker-end="url(#arrow)"/><path d="M1002 492 H1042" fill="none" stroke="#73839a" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="52" y="176" width="160" height="168" rx="22" fill="#0c1520" stroke="#26384c" stroke-width="2"/><rect x="52" y="176" width="160" height="6" rx="3" fill="#38bdf8"/><circle cx="88" cy="218" r="18" fill="#102a3a" stroke="#1f647d"/><path d="M80 212 h16 M80 218 h16 M80 224 h11" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round"/><text x="76" y="260" fill="#f8fafc" font-size="18" font-weight="750">Provider</text><text x="76" y="284" fill="#8ea1b8" font-size="13">XML snapshot</text><line x1="76" y1="302" x2="188" y2="302" stroke="#243246"/><text x="76" y="326" fill="#cbd5e1" font-size="12">unreliable boundary</text></g><g filter="url(#shadow)"><rect x="258" y="150" width="208" height="220" rx="22" fill="#0c1520" stroke="#26384c" stroke-width="2"/><rect x="258" y="150" width="208" height="6" rx="3" fill="#38bdf8"/><circle cx="296" cy="194" r="18" fill="#102a3a" stroke="#1f647d"/><path d="M287 194 h18 M296 185 v18" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round"/><text x="282" y="236" fill="#f8fafc" font-size="19" font-weight="750">Fetch worker</text><text x="282" y="261" fill="#8ea1b8" font-size="13">stream + stage</text><g transform="translate(282,282)"><rect width="160" height="38" rx="11" fill="#142638" stroke="#2b6c8b"/><circle cx="18" cy="19" r="5" fill="#38bdf8"/><text x="31" y="24" fill="#bae6fd" font-size="12" font-weight="700">advisory lock</text></g><text x="282" y="345" fill="#cbd5e1" font-size="12">one fetch / provider</text></g><g filter="url(#shadow)"><rect x="506" y="130" width="306" height="404" rx="24" fill="#0d1422" stroke="#3b4660" stroke-width="2"/><rect x="506" y="130" width="306" height="6" rx="3" fill="#a78bfa"/><g transform="translate(532,157)"><ellipse cx="18" cy="10" rx="16" ry="7" fill="#211d36" stroke="#7567b5"/><path d="M2 10 v22 c0 4 7 7 16 7s16-3 16-7V10" fill="#211d36" stroke="#7567b5"/><ellipse cx="18" cy="32" rx="16" ry="7" fill="none" stroke="#7567b5"/></g><text x="579" y="181" fill="#f8fafc" font-size="21" font-weight="750">PostgreSQL</text><text x="579" y="204" fill="#b8aee8" font-size="12" font-weight="700" letter-spacing="1">DURABLE STATE + COORDINATION</text><g transform="translate(532,228)"><rect width="254" height="72" rx="15" fill="#121b29" stroke="#343f56"/><text x="18" y="27" fill="#f8fafc" font-size="14" font-weight="700">ingestion_runs</text><text x="18" y="49" fill="#8ea1b8" font-size="12">fetch lifecycle · only STAGED is claimable</text></g><g transform="translate(532,314)"><rect width="254" height="92" rx="15" fill="#10251f" stroke="#356957"/><text x="18" y="27" fill="#d1fae5" font-size="14" font-weight="750">staging_plans</text><text x="18" y="49" fill="#9fb4aa" font-size="12">PENDING → PROCESSING → DONE / FAILED</text><g transform="translate(18,61)"><rect width="117" height="22" rx="8" fill="#123126" stroke="#3b8067"/><text x="58.5" y="15" text-anchor="middle" fill="#a7f3d0" font-size="10.5" font-weight="700">FOR UPDATE</text><rect x="124" width="112" height="22" rx="8" fill="#123126" stroke="#3b8067"/><text x="180" y="15" text-anchor="middle" fill="#a7f3d0" font-size="10.5" font-weight="700">SKIP LOCKED</text></g></g><g transform="translate(532,420)"><rect width="254" height="82" rx="15" fill="#151d2a" stroke="#3d4a60"/><text x="18" y="28" fill="#f8fafc" font-size="14" font-weight="700">plans</text><text x="18" y="50" fill="#8ea1b8" font-size="12">canonical upsert · stable read model</text><text x="18" y="69" fill="#c4b5fd" font-size="11" font-weight="700">(provider_id, external_plan_id)</text></g></g><g filter="url(#shadow)"><rect x="854" y="158" width="148" height="232" rx="22" fill="#0c1715" stroke="#2d5147" stroke-width="2"/><rect x="854" y="158" width="148" height="6" rx="3" fill="#34d399"/><text x="878" y="202" fill="#f8fafc" font-size="17" font-weight="750">Process workers</text><text x="878" y="225" fill="#8ea1b8" font-size="12">horizontal replicas</text><g transform="translate(878,245)"><rect width="100" height="33" rx="10" fill="#10261f" stroke="#356957"/><text x="50" y="21" text-anchor="middle" fill="#d1fae5" font-size="11" font-weight="700">worker A</text><rect y="43" width="100" height="33" rx="10" fill="#10261f" stroke="#356957"/><text x="50" y="64" text-anchor="middle" fill="#d1fae5" font-size="11" font-weight="700">worker B</text><rect y="86" width="100" height="33" rx="10" fill="#10261f" stroke="#356957"/><text x="50" y="107" text-anchor="middle" fill="#d1fae5" font-size="11" font-weight="700">worker N</text></g><text x="878" y="377" fill="#6ee7b7" font-size="11" font-weight="700">different rows, same queue</text></g><g filter="url(#shadow)"><rect x="856" y="428" width="146" height="128" rx="22" fill="#0c1520" stroke="#26384c" stroke-width="2"/><rect x="856" y="428" width="146" height="6" rx="3" fill="#fbbf24"/><text x="880" y="467" fill="#f8fafc" font-size="18" font-weight="750">Search API</text><text x="880" y="491" fill="#8ea1b8" font-size="12">GET /search</text><line x1="880" y1="506" x2="978" y2="506" stroke="#243246"/><text x="880" y="527" fill="#fde68a" font-size="11" font-weight="700">bulkhead + cache</text><text x="880" y="545" fill="#cbd5e1" font-size="11">DB-backed only</text></g><g filter="url(#shadow)"><rect x="1042" y="445" width="106" height="94" rx="20" fill="#111822" stroke="#344255"/><circle cx="1095" cy="476" r="14" fill="#1a2635" stroke="#667891"/><circle cx="1095" cy="471" r="5" fill="#cbd5e1"/><path d="M1084 488 c4-9 18-9 22 0" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/><text x="1095" y="520" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Client</text></g><g transform="translate(52,576)"><rect width="1096" height="76" rx="20" fill="#0b131e" stroke="#26384c"/><text x="24" y="29" fill="#8ea1b8" font-size="11" font-weight="700" letter-spacing="1.2">FAILURE BOUNDARIES</text><circle cx="218" cy="25" r="5" fill="#38bdf8"/><text x="232" y="30" fill="#dbeafe" font-size="12.5">Fetch: bounded retry + completed-run gate</text><circle cx="493" cy="25" r="5" fill="#34d399"/><text x="507" y="30" fill="#d1fae5" font-size="12.5">Process: claim + retry + stale-work requeue</text><circle cx="815" cy="25" r="5" fill="#fbbf24"/><text x="829" y="30" fill="#fde68a" font-size="12.5">Read: provider isolated + fail-fast bulkhead</text><text x="24" y="56" fill="#8ea1b8" font-size="12">Measured throughput and multiworker/recovery demonstrations remain separate evidence work; this diagram shows the implemented coordination boundaries.</text></g><text x="221" y="245" fill="#7dd3fc" font-size="11" font-weight="700">HTTP stream</text><text x="469" y="245" fill="#7dd3fc" font-size="11" font-weight="700">stage</text><text x="817" y="270" fill="#6ee7b7" font-size="11" font-weight="700">claim</text><text x="940" y="420" fill="#6ee7b7" font-size="11" font-weight="700">upsert</text><text x="817" y="480" fill="#94a3b8" font-size="11" font-weight="700">read</text></g></svg>