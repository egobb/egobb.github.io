- title: "Order Tracking"
  canonicalTitle: "Order Tracking — Event-Driven Ingestion with Kafka"
  summary: "Order-event ingestion moved behind Kafka while preserving a per-order ordering boundary."
  description: "A Kafka-backed order ingestion path that absorbs bursts without coupling HTTP latency to database processing, while keeping state-transition rules outside messaging and persistence concerns."
  sections:
    - title: "Decision"
      body: "Order ID is the Kafka key, so events for one order share a partition and preserve per-order ordering while unrelated orders continue in parallel."
    - title: "Limitation"
      body: "The flow is not end-to-end exactly once: there is no durable event identity for database deduplication or a dedicated safe replay path yet."
  caseStudyPageRef: "/projects/order-tracking"
  repositoryUrl: "https://github.com/egobb/order-tracking"
  articlePageRef: "/posts/scaling-order-tracking-kafka"
- title: "Snapshot Ingestion"
  canonicalTitle: "Snapshot Ingestion — Resilient Coordination with PostgreSQL"
  summary: "Periodic XML snapshots staged and coordinated in PostgreSQL without adding a broker by default."
  description: "A snapshot-ingestion service that isolates unreliable provider fetches from the search path, stages streamed XML durably, and recovers worker progress through visible PostgreSQL state."
  sections:
    - title: "Decision"
      body: "Because the source is a periodic snapshot and PostgreSQL is already canonical storage, the database also owns durable staging instead of adding broker operations before the workload requires them."
    - title: "Boundary"
      body: "Advisory locks serialize provider fetches and SKIP LOCKED distributes staged work; the shared database remains the scaling limit if contention, fan-out or replay requirements grow."
  caseStudyPageRef: "/projects/snapshot-ingestion"
  repositoryUrl: "https://github.com/egobb/plan-service"
  articlePageRef: "/posts/when-postgres-is-enough-snapshot-ingestion-pipeline"
