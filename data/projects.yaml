- title: "Order Tracking"
  canonicalTitle: "Order Tracking — Event-Driven Ingestion with Kafka"
  summary: "Order-event ingestion moved behind Kafka while preserving a per-order ordering boundary."
  description: "An order-tracking backend that accepts bursts of updates without making HTTP request latency depend on database processing, while keeping state-transition rules independent from Kafka and persistence."
  sections:
    - title: "Ordering boundary"
      body: "Events are published with order ID as the Kafka key, so records for one order share a partition and retain that partition's order. The guarantee is per order, not global; unrelated orders can progress in parallel."
    - title: "Current limitation"
      body: "The flow does not provide end-to-end exactly-once processing today. There is no durable event identity for database deduplication or dedicated safe replay path, so redelivery and replay remain explicit follow-up work."
  caseStudyPageRef: "/projects/order-tracking"
  repositoryUrl: "https://github.com/egobb/order-tracking"
  articlePageRef: "/posts/scaling-order-tracking-kafka"
- title: "Snapshot Ingestion"
  canonicalTitle: "Snapshot Ingestion — Resilient Coordination with PostgreSQL"
  summary: "Periodic XML snapshots staged and coordinated in PostgreSQL without adding a broker by default."
  description: "A snapshot-ingestion service that keeps unreliable provider fetches out of the search request path, stages streamed XML durably, and lets processing workers recover from retries and crashes through visible database state."
  sections:
    - title: "Why PostgreSQL"
      body: "The provider produces periodic snapshots rather than a continuous event stream, and the service already needs PostgreSQL for canonical data. Using the same database for staging keeps the hand-off durable and inspectable without adding broker operations that the current workload does not require."
    - title: "Coordination model"
      body: "Per-provider advisory locks prevent duplicate concurrent fetches, while FOR UPDATE SKIP LOCKED lets multiple processing workers claim different staged rows. Completed-run gating keeps a partial fetch from becoming canonical data."
    - title: "Operational pressure"
      body: "PostgreSQL now carries serving, staging and coordination traffic, so connection budgets and contention are the main limit. A broker becomes useful if measured ingestion pressure, fan-out, independent consumers or replay requirements outgrow that boundary."
  caseStudyPageRef: "/projects/snapshot-ingestion"
  repositoryUrl: "https://github.com/egobb/plan-service"
  articlePageRef: "/posts/when-postgres-is-enough-snapshot-ingestion-pipeline"
