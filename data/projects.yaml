- title: "Order Tracking"
  canonicalTitle: "Order Tracking — Event-Driven Ingestion with Kafka"
  summary: "Event-driven order tracking with Kafka and Spring Boot."
  problem: "Move order-event ingestion off the synchronous request path without losing per-order ordering."
  architecturalProposition: "An asynchronous Kafka ingestion pipeline keeps request handling thin while DDD and hexagonal boundaries isolate domain rules from transport and persistence."
  designChoices:
    - "Key Kafka messages by order ID so all events for the same order stay on the same partition and preserve order."
    - "Keep domain validation and application workflows behind DDD and hexagonal boundaries instead of coupling them to Kafka or PostgreSQL."
    - "Use Testcontainers, GitHub Actions and a Terraform-managed AWS environment as reproducible delivery evidence."
  evidence: "Ordered event ingestion · Domain validation · Testcontainers · AWS/Terraform"
  stack:
    - "Java"
    - "Spring Boot"
    - "Kafka"
    - "PostgreSQL"
    - "AWS"
    - "Terraform"
  caseStudyPageRef: "/projects/order-tracking"
  repositoryUrl: "https://github.com/egobb/order-tracking"
  articlePageRef: "/posts/scaling-order-tracking-kafka"
- title: "Snapshot Ingestion"
  canonicalTitle: "Snapshot Ingestion — Resilient Coordination with PostgreSQL"
  summary: "Resilient snapshot ingestion coordinated with PostgreSQL."
  problem: "Ingest unreliable XML snapshots without exposing provider latency and failures to stable search requests or adding Kafka before it is needed."
  architecturalProposition: "A staged PostgreSQL pipeline separates provider access from asynchronous processing and uses the database as both durable storage and a lightweight coordination mechanism."
  designChoices:
    - "Stage fetched snapshots before processing so provider availability is isolated from the read path."
    - "Coordinate horizontal workers with SKIP LOCKED and advisory locks instead of introducing a separate broker."
    - "Combine streaming XML parsing, idempotent upserts and stale-work recovery so retries remain bounded and safe."
  evidence: "Streaming XML · SKIP LOCKED · Advisory locks · Idempotent upserts"
  stack:
    - "Java"
    - "Spring Boot"
    - "PostgreSQL"
    - "XML"
  caseStudyPageRef: "/projects/snapshot-ingestion"
  repositoryUrl: "https://github.com/egobb/plan-service"
  articlePageRef: "/posts/when-postgres-is-enough-snapshot-ingestion-pipeline"
