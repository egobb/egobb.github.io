name: Epic 47 accept issue 48 baselines

on:
  push:
    branches:
      - 'issue/48-global-shell-editorial-restraint'
    paths:
      - '.visual-baseline-acceptance/issue-48.txt'

permissions:
  contents: write

jobs:
  accept-reviewed-baselines:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: latest
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: hugo --minify

      - name: Regenerate reviewed snapshots
        run: npm run visual:update

      - name: Verify regenerated snapshots
        run: npm run visual:test

      - name: Commit only snapshot changes
        shell: bash
        run: |
          git add tests/visual/__snapshots__
          if git diff --cached --quiet; then
            echo 'No baseline changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: accept reviewed editorial shell baselines'
          git push origin HEAD:${GITHUB_REF_NAME}
