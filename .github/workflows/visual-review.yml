name: Visual review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: latest
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Hugo site
        run: hugo --minify

      - name: Run visual review
        env:
          VISUAL_REVIEW_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run visual:test

      - name: Upload visual-review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/visual-review
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
