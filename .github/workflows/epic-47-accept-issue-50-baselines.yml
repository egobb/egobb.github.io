name: Epic 47 accept issue 50 baselines

on:
  push:
    branches:
      - issue/50-flatten-projects-cards
    paths:
      - .visual-baseline-acceptance/issue-50.txt

permissions:
  contents: write

jobs:
  accept-reviewed-baselines:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: issue/50-flatten-projects-cards
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: latest
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Hugo site
        run: hugo --minify

      - name: Regenerate reviewed snapshots
        run: npm run visual:update

      - name: Verify regenerated baseline
        run: npm run visual:test

      - name: Commit only reviewed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__snapshots__
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "test: accept reviewed issue 50 editorial project baselines"
          git push origin HEAD:issue/50-flatten-projects-cards
