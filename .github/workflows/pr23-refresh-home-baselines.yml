name: PR 23 refresh combined Home baselines

on:
  push:
    branches:
      - feat/portfolio-roadmap-39-projects-hub

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: latest
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Hugo site
        run: hugo --minify

      - name: Refresh visual snapshots in CI environment
        run: npx playwright test tests/visual/pages.spec.ts --update-snapshots

      - name: Commit only combined Home baselines
        shell: bash
        run: |
          git add \
            tests/visual/__snapshots__/home-desktop.png \
            tests/visual/__snapshots__/home-tablet.png \
            tests/visual/__snapshots__/home-mobile.png
          if git diff --cached --quiet; then
            echo "Home baselines already match the combined rendering."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: refresh Home baselines after main merge"
          git push origin HEAD:${{ github.ref_name }}
