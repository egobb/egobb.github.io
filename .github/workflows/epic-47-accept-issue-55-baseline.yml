name: Epic 47 accept issue 55 baseline

on:
  push:
    branches:
      - issue/55-mobile-composition
    paths:
      - '.visual-baseline-acceptance/issue-55.txt'

permissions:
  contents: write

jobs:
  accept:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: issue/55-mobile-composition
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: latest
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: hugo --minify
      - run: npm run visual:update
      - run: npm run visual:test

      - name: Verify and commit reviewed baseline only
        shell: bash
        run: |
          set -euo pipefail
          git add tests/visual/__snapshots__/

          changed=$(git diff --cached --name-only)
          expected='tests/visual/__snapshots__/home-mobile.png'

          if [ "$changed" != "$expected" ]; then
            echo "Unexpected baseline set:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: accept reviewed issue 55 mobile baseline'
          git push origin HEAD:issue/55-mobile-composition
