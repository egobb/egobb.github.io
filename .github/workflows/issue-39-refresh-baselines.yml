name: Issue 39 baseline refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-39-baseline-refresh-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.head_ref == 'verify/portfolio-roadmap-39-projects-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: latest
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Hugo site
        run: hugo --minify

      - name: Refresh reviewed baselines
        run: npm run visual:update

      - name: Commit only approved baseline files
        shell: bash
        run: |
          git add \
            tests/visual/__snapshots__/home-desktop.png \
            tests/visual/__snapshots__/home-tablet.png \
            tests/visual/__snapshots__/home-mobile.png \
            tests/visual/__snapshots__/projects-mobile.png
          if git diff --cached --quiet; then
            echo "Baselines already match the reviewed rendering."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: accept issue 39 visual baselines"
          git push origin HEAD:${{ github.head_ref }}
