name: Epic 47 accept issue 54 baselines

on:
  push:
    branches:
      - issue/54-residual-visual-cleanup
    paths:
      - '.visual-baseline-acceptance/issue-54.txt'

permissions:
  contents: write

jobs:
  accept:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: issue/54-residual-visual-cleanup
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: latest
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: hugo --minify
      - run: npm run visual:update
      - run: npm run visual:test

      - name: Verify and commit reviewed baselines only
        shell: bash
        run: |
          set -euo pipefail
          git add tests/visual/__snapshots__/

          if git diff --cached --quiet; then
            echo 'No baseline changes to commit.'
            exit 0
          fi

          allowed=$(cat <<'EOF'
          tests/visual/__snapshots__/about-editorial-mobile.png
          tests/visual/__snapshots__/about-editorial-tablet.png
          tests/visual/__snapshots__/home-mobile.png
          tests/visual/__snapshots__/home-tablet.png
          tests/visual/__snapshots__/long-article-mobile.png
          tests/visual/__snapshots__/projects-mobile.png
          tests/visual/__snapshots__/writing-editorial-mobile.png
          tests/visual/__snapshots__/writing-editorial-tablet.png
          EOF
          )

          changed=$(git diff --cached --name-only)
          while IFS= read -r path; do
            if ! grep -Fxq "$path" <<< "$allowed"; then
              echo "Unexpected baseline change: $path" >&2
              exit 1
            fi
          done <<< "$changed"

          while IFS= read -r expected; do
            if ! grep -Fxq "$expected" <<< "$changed"; then
              echo "Expected reviewed baseline was not regenerated: $expected" >&2
              exit 1
            fi
          done <<< "$allowed"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: accept reviewed issue 54 baselines'
          git push origin HEAD:issue/54-residual-visual-cleanup
